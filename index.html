<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartHelper</title>

<!-- SolaimanLipi Bangla font -->
<link rel="stylesheet" href="https://fonts.maateen.me/solaiman-lipi/font.css">

<!-- Suppress the Tailwind CDN "should not be used in production" dev notice
     (cosmetic console message only — does not affect functionality). -->
<script>
  (function(){
    var origWarn = console.warn;
    console.warn = function(){
      if (arguments[0] && String(arguments[0]).indexOf('cdn.tailwindcss.com') !== -1) return;
      origWarn.apply(console, arguments);
    };
  })();
</script>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: {} } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- QR code generator (client-side, no server calls) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- Image -> PDF (client-side) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  html { scroll-behavior: smooth; }

  :root{
    --bg-1:#faf5ea; --bg-2:#f0e4cd;
    --card-top:#fffdf9; --card-bottom:#f8efdc;
    --card-border:rgba(178,138,60,.22);
    --accent-1:#eccb87; --accent-2:#c79a3e; --accent-ink:#4a3410;
    --ink:#2d2715; --ink-soft:#75684e;
    --input-bg:#fffcf5; --input-border:#e3d4ad;
  }
  html.dark{
    --bg-1:#1a1510; --bg-2:#100d09;
    --card-top:#2a2115; --card-bottom:#1d1710;
    --card-border:rgba(212,164,70,.20);
    --accent-1:#e9c479; --accent-2:#b8872f; --accent-ink:#2a1d08;
    --ink:#f3e9d4; --ink-soft:#b8a888;
    --input-bg:#221b12; --input-border:#3a2f1c;
  }

  body{
    font-family:'Inter', ui-sans-serif, system-ui, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 500px at 10% -10%, rgba(255,255,255,.55), transparent 60%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    min-height:100vh;
  }
  html.dark body{
    background:
      radial-gradient(1100px 500px at 10% -10%, rgba(255,255,255,.04), transparent 60%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
  }

  body.font-bangla, body.font-bangla * {
    font-family:'SolaimanLipi','Noto Sans Bengali',sans-serif !important;
  }
  body.font-bangla{ line-height:1.75; }
  button, input, select, textarea, optgroup { font-family: inherit; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--accent-2); border-radius:9999px; }

  .fade-in{ animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .card{
    position:relative; overflow:hidden; border-radius:1.1rem;
    background:linear-gradient(180deg, var(--card-top), var(--card-bottom));
    border:1px solid var(--card-border);
    box-shadow:0 1px 1px rgba(255,255,255,.6) inset, 0 14px 34px -16px rgba(90,62,16,.35);
  }
  html.dark .card{ box-shadow:0 1px 1px rgba(255,255,255,.05) inset, 0 14px 34px -16px rgba(0,0,0,.55); }
  .card::before{
    content:""; position:absolute; inset:0 0 auto 0; height:48%; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,0));
  }
  html.dark .card::before{ background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0)); }

  .glass-chip{
    background:linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.25));
    border:1px solid var(--card-border);
    backdrop-filter:blur(6px);
  }
  html.dark .glass-chip{ background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); }

  .btn-primary{
    background:linear-gradient(180deg, var(--accent-1), var(--accent-2));
    color:var(--accent-ink);
    box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 8px 18px -6px rgba(150,108,24,.55);
    transition:filter .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-primary:active{ transform:translateY(1px); }
  .btn-primary:disabled{ opacity:.45; filter:none; }

  .btn-secondary{
    background:linear-gradient(180deg, #fffdf8, #f2e8d2);
    border:1px solid var(--card-border); color:var(--ink);
    transition:filter .15s ease;
  }
  html.dark .btn-secondary{ background:linear-gradient(180deg, #27201582, #1c170f); color:var(--ink); }
  .btn-secondary:hover{ filter:brightness(1.04); }
  .btn-secondary:disabled{ opacity:.45; }

  .field{ background:var(--input-bg); border:1px solid var(--input-border); color:var(--ink); }
  .field:focus{ outline:none; border-color:var(--accent-2); box-shadow:0 0 0 3px rgba(199,154,62,.18); }

  .icon-badge{
    width:2.6rem; height:2.6rem; border-radius:.85rem;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background:linear-gradient(180deg, var(--accent-1), var(--accent-2));
    color:#fffaf0; box-shadow:0 6px 14px -5px rgba(150,108,24,.55);
  }
  .icon-badge.lg{ width:3.25rem; height:3.25rem; border-radius:1rem; }
  .icon-badge.sm{ width:2.1rem; height:2.1rem; border-radius:.65rem; }
  .icon-badge.red{ background:linear-gradient(180deg,#f3a5a5,#d9534f); box-shadow:0 6px 14px -5px rgba(185,55,55,.5); }
  .icon-badge.blue{ background:linear-gradient(180deg,#9fc3ec,#4f82c7); box-shadow:0 6px 14px -5px rgba(45,85,150,.5); }
  .icon-badge.orange{ background:linear-gradient(180deg,#f3c08a,#d98a2f); box-shadow:0 6px 14px -5px rgba(185,120,30,.5); }
  .icon-badge.green{ background:linear-gradient(180deg,#a9d8b4,#4f9a63); box-shadow:0 6px 14px -5px rgba(45,120,70,.5); }
  .icon-badge.purple{ background:linear-gradient(180deg,#c9b2ec,#8a5fc7); box-shadow:0 6px 14px -5px rgba(110,65,180,.5); }

  .icon{ width:1.35rem; height:1.35rem; stroke:currentColor; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .icon-sm{ width:1.1rem; height:1.1rem; }
  .icon-xs{ width:.95rem; height:.95rem; }
  .icon-lg{ width:1.7rem; height:1.7rem; }
  .icon-xl{ width:1.9rem; height:1.9rem; }

  .toggle-dot{ transition:transform .25s ease; }

  input[type=range]{
    -webkit-appearance:none; appearance:none; height:5px; border-radius:9999px;
    background:linear-gradient(90deg, var(--accent-2), var(--accent-1));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%;
    background:#fffaf0; border:2px solid var(--accent-2); cursor:pointer; margin-top:-6.5px;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  input[type=range]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%; background:#fffaf0; border:2px solid var(--accent-2); cursor:pointer;
  }

  .gov-link:hover .gov-arrow{ transform:translateX(3px); }
  .gov-arrow{ transition:transform .15s ease; }

  /* ===== Multi-page navigation ===== */
  .page{ display:none; }
  .page.active{ display:block; animation:pageIn .3s ease; }
  @keyframes pageIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  /* Fixed bottom app-style tab bar */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:linear-gradient(180deg, var(--card-top), var(--card-bottom));
    border-top:1px solid var(--card-border);
    box-shadow:0 -10px 30px -14px rgba(90,62,16,.35);
    padding-bottom:env(safe-area-inset-bottom);
  }
  html.dark .bottom-nav{ box-shadow:0 -10px 30px -14px rgba(0,0,0,.6); }

  .nav-btn{
    flex:1; min-width:0; position:relative; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:.25rem;
    padding:.6rem .25rem .55rem; font-size:.66rem; font-weight:600;
    color:var(--ink-soft); transition:color .15s ease;
  }
  .nav-btn span{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-btn::before{
    content:""; position:absolute; top:.2rem; left:50%; translate:-50% 0;
    width:2rem; height:2rem; border-radius:.7rem; z-index:-1;
    transition:background .15s ease;
  }
  .nav-btn.nav-active{ color:var(--accent-2); }
  .nav-btn.nav-active::before{ background:linear-gradient(180deg, var(--accent-1), var(--accent-2)); opacity:.18; }
  .nav-btn.nav-active svg{ color:var(--accent-2); }

  .home-card{ cursor:pointer; text-align:left; width:100%; transition:transform .15s ease, box-shadow .15s ease; }
  .home-card:hover{ transform:translateY(-3px); }

  .tool-chip{
    cursor:pointer; text-align:left; display:flex; align-items:center; gap:.6rem;
    padding:.65rem .75rem; border-radius:.85rem; transition:transform .15s ease, filter .15s ease;
  }
  .tool-chip:hover{ transform:translateY(-2px); filter:brightness(1.03); }

  .pill{
    display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .9rem;
    border-radius:9999px; font-size:.78rem; font-weight:600; color:var(--ink-soft);
  }

  .recent-chip{
    display:inline-flex; align-items:center; gap:.4rem; padding:.45rem .9rem;
    border-radius:9999px; font-size:.78rem; font-weight:600; white-space:nowrap;
    cursor:pointer; transition:filter .15s ease;
  }
  .recent-chip:hover{ filter:brightness(1.04); }

  .seg-wrap{ display:flex; gap:.5rem; }

  .list-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:.75rem .9rem; border-radius:.75rem; margin-bottom:.4rem;
  }
  .list-row.row-active{
    background:linear-gradient(180deg, var(--accent-1), var(--accent-2)); color:var(--accent-ink);
  }

  .note-item{
    display:flex; align-items:center; justify-content:space-between; gap:.6rem;
    padding:.65rem .9rem; border-radius:.75rem; margin-bottom:.5rem;
  }
  .note-del{ flex-shrink:0; color:var(--ink-soft); transition:color .15s ease; cursor:pointer; }
  .note-del:hover{ color:#d9534f; }

  #qrCanvasBox img, #qrCanvasBox canvas{ border-radius:.75rem; background:#fff; padding:10px; }

  .result-box{
    border-radius:.85rem; padding:1rem; text-align:center;
  }
</style>
</head>

<body class="min-h-screen transition-colors duration-300">

<!-- ===================== HEADER ===================== -->
<header class="sticky top-0 z-40 backdrop-blur glass-chip border-b" style="border-color:var(--card-border);">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <button class="flex items-center gap-2.5" id="logoHomeBtn" aria-label="Go to home">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center font-extrabold text-lg"
           style="background:linear-gradient(180deg, var(--accent-1), var(--accent-2)); color:var(--accent-ink); box-shadow:0 6px 14px -5px rgba(150,108,24,.5);">S</div>
      <span class="text-xl font-extrabold tracking-tight">SmartHelper</span>
    </button>

    <div class="flex items-center gap-3">
      <button id="langToggle" class="relative flex items-center glass-chip rounded-full p-1 w-20 h-9 text-xs font-semibold select-none" aria-label="Toggle language">
        <span class="absolute left-1 top-1 bottom-1 w-9 rounded-full toggle-dot" id="langDot"
              style="background:linear-gradient(180deg, var(--accent-1), var(--accent-2)); box-shadow:0 2px 6px rgba(0,0,0,.2);"></span>
        <span class="relative z-10 w-1/2 text-center" id="langLabelEn">EN</span>
        <span class="relative z-10 w-1/2 text-center" id="langLabelBn">বাং</span>
      </button>

      <button id="themeToggle" class="w-9 h-9 rounded-full glass-chip flex items-center justify-center" aria-label="Toggle theme">
        <svg id="iconSun" class="icon icon-sm hidden" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2 12h2M20 12h2M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/></svg>
        <svg id="iconMoon" class="icon icon-sm hidden" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ===================== BOTTOM APP NAV ===================== -->
<nav class="bottom-nav">
  <div class="max-w-6xl mx-auto px-2 flex items-stretch justify-around">
    <button class="nav-btn" data-nav="home">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v10h5v-6h2v6h5V10"/></svg>
      <span data-i18n="navHome"></span>
    </button>
    <button class="nav-btn" data-nav="media">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span data-i18n="navMedia"></span>
    </button>
    <button class="nav-btn" data-nav="calc">
      <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><rect x="7.5" y="4.5" width="9" height="3.5" rx=".5"/><path d="M7.5 11h9M7.5 14.5h9M7.5 18h9M11 11v7M14.5 11v7"/></svg>
      <span data-i18n="navCalc"></span>
    </button>
    <button class="nav-btn" data-nav="islamic">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3c0 1.1-.6 2-1.5 2.5V9h-3V7.5C9.6 7 9 6.1 9 5a3 3 0 0 1 3-3z"/><path d="M4 21V12l3-2 3 2v9M11 21v-6h2v6M14 21v-9l3-2 3 2v9"/><path d="M3 21h18"/></svg>
      <span data-i18n="navIslamic"></span>
    </button>
    <button class="nav-btn" data-nav="more">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span data-i18n="navMore"></span>
    </button>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-4 pt-8" style="padding-bottom:calc(5.5rem + env(safe-area-inset-bottom));">

  <!-- ===================== PAGE: HOME ===================== -->
  <section class="page" data-page="home">

    <div class="flex justify-center mb-4">
      <span class="pill glass-chip">
        <svg class="icon icon-xs" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span id="greetingText"></span>
        <span id="liveClock" class="font-bold" style="color:var(--accent-2);"></span>
      </span>
    </div>

    <div class="text-center pb-6">
      <h1 class="text-3xl md:text-4xl font-extrabold mb-2" data-i18n="heroTitle"></h1>
      <p style="color:var(--ink-soft);" class="max-w-2xl mx-auto" data-i18n="heroSubtitle"></p>
    </div>

    <!-- Next prayer widget -->
    <div class="card p-4 md:p-5 mb-6 flex items-center gap-4 cursor-pointer" id="nextPrayerCard" data-goto="islamic">
      <div class="icon-badge lg">
        <svg class="icon icon-xl" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3c0 1.1-.6 2-1.5 2.5V9h-3V7.5C9.6 7 9 6.1 9 5a3 3 0 0 1 3-3z"/><path d="M4 21V12l3-2 3 2v9M11 21v-6h2v6M14 21v-9l3-2 3 2v9"/><path d="M3 21h18"/></svg>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-xs font-semibold" style="color:var(--ink-soft);" data-i18n="nextPrayerLabel"></div>
        <div class="text-lg font-bold truncate"><span id="nextPrayerName"></span> — <span id="nextPrayerTime"></span></div>
        <div class="text-xs" style="color:var(--accent-2);"><span data-i18n="nextPrayerCountdownPrefix"></span> <span id="nextPrayerCountdown"></span></div>
      </div>
    </div>

    <!-- Recently used -->
    <div id="recentWrap" class="mb-6 hidden">
      <div class="text-sm font-semibold mb-2" style="color:var(--ink-soft);" data-i18n="recentTitle"></div>
      <div id="recentChips" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- Big feature cards -->
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
      <button class="home-card card p-5" data-goto="media">
        <div class="icon-badge lg mb-4">
          <svg class="icon icon-xl" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </div>
        <h3 class="font-bold mb-1" data-i18n="navMedia"></h3>
        <p class="text-xs" style="color:var(--ink-soft);" data-i18n="mediaPageDesc"></p>
      </button>

      <button class="home-card card p-5" data-goto="calc">
        <div class="icon-badge lg mb-4">
          <svg class="icon icon-xl" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><rect x="7.5" y="4.5" width="9" height="3.5" rx=".5"/><path d="M7.5 11h9M7.5 14.5h9M7.5 18h9M11 11v7M14.5 11v7"/></svg>
        </div>
        <h3 class="font-bold mb-1" data-i18n="navCalc"></h3>
        <p class="text-xs" style="color:var(--ink-soft);" data-i18n="calcPageDesc"></p>
      </button>

      <button class="home-card card p-5" data-goto="islamic">
        <div class="icon-badge lg mb-4">
          <svg class="icon icon-xl" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3c0 1.1-.6 2-1.5 2.5V9h-3V7.5C9.6 7 9 6.1 9 5a3 3 0 0 1 3-3z"/><path d="M4 21V12l3-2 3 2v9M11 21v-6h2v6M14 21v-9l3-2 3 2v9"/><path d="M3 21h18"/></svg>
        </div>
        <h3 class="font-bold mb-1" data-i18n="navIslamic"></h3>
        <p class="text-xs" style="color:var(--ink-soft);" data-i18n="islamicPageDesc"></p>
      </button>

      <button class="home-card card p-5" data-goto="more">
        <div class="icon-badge lg red mb-4">
          <svg class="icon icon-xl" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h16.9a2 2 0 0 0 1.7-3L13.6 3.9a2 2 0 0 0-3.3 0z"/><path d="M12 9v4M12 17h.01"/></svg>
        </div>
        <h3 class="font-bold mb-1" data-i18n="navMore"></h3>
        <p class="text-xs" style="color:var(--ink-soft);" data-i18n="morePageDesc"></p>
      </button>
    </div>

    <!-- All tools quick grid -->
    <div class="text-sm font-semibold mb-3" style="color:var(--ink-soft);" data-i18n="allToolsTitle"></div>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
      <button class="tool-chip glass-chip" data-goto="media">
        <div class="icon-badge sm"><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
        <span class="text-sm font-medium" data-i18n="imgSectionTitle"></span>
      </button>
      <button class="tool-chip glass-chip" data-goto="media">
        <div class="icon-badge sm"><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M17 17h3v3h-3z"/></svg></div>
        <span class="text-sm font-medium" data-i18n="qrSectionTitle"></span>
      </button>
      <button class="tool-chip glass-chip" data-goto="media">
        <div class="icon-badge sm"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><path d="M8.5 17v-5h1.3c1 0 1.7.6 1.7 1.5s-.7 1.5-1.7 1.5H8.5M13 17v-5h2M12.5 14.5h2"/></svg></div>
        <span class="text-sm font-medium" data-i18n="pdfSectionTitle"></span>
      </button>
      <button class="tool-chip glass-chip" data-goto="calc">
        <div class="icon-badge sm"><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2.2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></div>
        <span class="text-sm font-medium" data-i18n="ageSectionTitle"></span>
      </button>
      <button class="tool-chip glass-chip" data-goto="calc">
        <div class="icon-badge sm"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M7 7h11M18 7l-3-3M18 7l-3 3"/><path d="M17 17H6M6 17l3-3M6 17l3 3"/></svg></div>
        <span class="text-sm font-medium" data-i18n="unitSectionTitle"></span>

let currentLang = localStorage.getItem('sh_lang') || 'en';

function applyLang(lang) {
  currentLang = lang;
  localStorage.setItem('sh_lang', lang);
  document.documentElement.setAttribute('data-lang', lang);
  document.documentElement.lang = lang;
  document.body.classList.toggle('font-bangla', lang === 'bn');

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang][key] !== undefined) el.textContent = translations[lang][key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (translations[lang][key] !== undefined) el.placeholder = translations[lang][key];
  });

  const grpPct = document.getElementById('imgSizeGroupPct');
  const grpPx = document.getElementById('imgSizeGroupPx');
  if (grpPct) grpPct.label = translations[lang].imgSizeGroupPct;
  if (grpPx) grpPx.label = translations[lang].imgSizeGroupPx;

  const dot = document.getElementById('langDot');
  dot.style.transform = lang === 'bn' ? 'translateX(100%)' : 'translateX(0)';

  populateUnitSelects(currentUnitTab);
  renderUnitConversion();
  if (typeof updateSizePreview === 'function') updateSizePreview();
  if (typeof renderPrayerList === 'function') renderPrayerList();
  if (typeof updateGreeting === 'function') updateGreeting();
  if (typeof renderRecent === 'function') renderRecent();
  if (typeof renderNotes === 'function') renderNotes();
  if (typeof populateCurrencySelects === 'function') populateCurrencySelects();
}

document.getElementById('langToggle').addEventListener('click', () => {
  applyLang(currentLang === 'en' ? 'bn' : 'en');
});

/* ============================================================
   MULTI-PAGE NAVIGATION + RECENTLY USED
   ============================================================ */
const pageNames = ['home', 'media', 'calc', 'islamic', 'more'];
const pageEls = document.querySelectorAll('.page');
const navBtns = document.querySelectorAll('.nav-btn');

function getRecent() {
  try { return JSON.parse(localStorage.getItem('sh_recent') || '[]'); } catch(e) { return []; }
}
function addRecent(name) {
  if (name === 'home') return;
  let list = getRecent().filter(n => n !== name);
  list.unshift(name);
  list = list.slice(0, 4);
  try { localStorage.setItem('sh_recent', JSON.stringify(list)); } catch(e) {}
}
const navIconMap = {
  media: '<svg class="icon icon-xs" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  calc: '<svg class="icon icon-xs" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M7.5 11h9M7.5 14.5h9M7.5 18h9"/></svg>',
  islamic: '<svg class="icon icon-xs" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3c0 1.1-.6 2-1.5 2.5V9h-3V7.5C9.6 7 9 6.1 9 5a3 3 0 0 1 3-3z"/></svg>',
  more: '<svg class="icon icon-xs" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>'
};
function renderRecent() {
  const wrap = document.getElementById('recentWrap');
  const box = document.getElementById('recentChips');
  const list = getRecent();
  if (!list.length) { wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');
  box.innerHTML = '';
  list.forEach(name => {
    if (!pageNames.includes(name)) return;
    const chip = document.createElement('button');
    chip.className = 'recent-chip glass-chip';
    chip.innerHTML = (navIconMap[name] || '') + '<span>' + (translations[currentLang]['nav' + name.charAt(0).toUpperCase() + name.slice(1)] || name) + '</span>';
    chip.addEventListener('click', () => showPage(name));
    box.appendChild(chip);
  });
}

function showPage(name) {
  if (!pageNames.includes(name)) name = 'home';
  pageEls.forEach(p => p.classList.toggle('active', p.getAttribute('data-page') === name));
  navBtns.forEach(b => b.classList.toggle('nav-active', b.getAttribute('data-nav') === name));
  if (location.hash.replace('#', '') !== name) history.replaceState(null, '', '#' + name);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  addRecent(name);
  renderRecent();
}

navBtns.forEach(btn => btn.addEventListener('click', () => showPage(btn.getAttribute('data-nav'))));
document.querySelectorAll('[data-goto]').forEach(el => el.addEventListener('click', () => showPage(el.getAttribute('data-goto'))));
document.getElementById('logoHomeBtn').addEventListener('click', () => showPage('home'));
window.addEventListener('hashchange', () => showPage(location.hash.replace('#', '')));

/* ============================================================
   GREETING + LIVE CLOCK
   ============================================================ */
function updateGreeting() {
  const now = new Date();
  const h = now.getHours();
  let key = 'greetMorning';
  if (h >= 12 && h < 16) key = 'greetAfternoon';
  else if (h >= 16 && h < 19) key = 'greetEvening';
  else if (h >= 19 || h < 5) key = 'greetNight';
  document.getElementById('greetingText').textContent = translations[currentLang][key] + ' •';
  const hh = String(h % 12 === 0 ? 12 : h % 12).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  document.getElementById('liveClock').textContent = `${hh}:${mm} ${ampm}`;
}
updateGreeting();
setInterval(updateGreeting, 30000);

let toastTimer;
function showToast(key) {
  const el = document.getElementById('toast');
  el.textContent = translations[currentLang][key] || key;
  el.classList.remove('opacity-0');
  el.classList.add('opacity-100');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('opacity-100'); el.classList.add('opacity-0'); }, 2500);
}

function handleImageFile(file) {
  originalFileSize = file.size;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      originalImage = img;
      originalRatio = img.width / img.height;
      imgPreview.src = e.target.result;
      imgPreview.classList.remove('hidden');
      imgPreviewPlaceholder.classList.add('hidden');
      imgDownloadBtn.disabled = true;
      imgSizeInfo.textContent = '';
      updateSizePreview();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function getTargetDims() {
  if (!originalImage) return { w: 0, h: 0 };
  const val = imgSizeSelect.value;
  if (val.startsWith('pct-')) {
    const pct = parseInt(val.split('-')[1]) / 100;
    return { w: Math.max(1, Math.round(originalImage.width * pct)), h: Math.max(1, Math.round(originalImage.height * pct)) };
  }
  if (val.startsWith('w-')) {
    const w = parseInt(val.split('-')[1]);
    return { w, h: Math.max(1, Math.round(w / originalRatio)) };
  }
  return { w: originalImage.width, h: originalImage.height };
}
function updateSizePreview() {
  if (!originalImage) { imgSizePreviewDims.textContent = ''; return; }
  const { w, h } = getTargetDims();
  const prefix = translations[currentLang].imgSizePreviewPrefix || '';
  imgSizePreviewDims.textContent = `${prefix}${w} × ${h} px`;
}

const pdfInput = document.getElementById('pdfInput');

  pdfDropZone.style.borderColor = 'var(--input-border)';
  if (e.dataTransfer.files && e.dataTransfer.files.length) { pdfFiles = Array.from(e.dataTransfer.files); updatePdfCount(); }
});

function updatePdfCount() {
  pdfFileCount.textContent = pdfFiles.length ? `${pdfFiles.length} ${currentLang === 'bn' ? 'টি ছবি নির্বাচিত' : 'image(s) selected'}` : '';
}
function fileToImageEl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => resolve({ img, dataUrl: e.target.result });
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
pdfConvertBtn.addEventListener('click', async () => {
  if (!pdfFiles.length) { showToast('toastPdfNoImages'); return; }
  try {
    const { jsPDF } = window.jspdf;
    let doc = null;
    for (let i = 0; i < pdfFiles.length; i++) {
      const { img, dataUrl } = await fileToImageEl(pdfFiles[i]);
      const orientation = img.width > img.height ? 'l' : 'p';
      if (!doc) doc = new jsPDF({ orientation, unit: 'mm', format: 'a4' });
      else doc.addPage('a4', orientation);
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const margin = 8;
      const maxW = pageWidth - margin * 2, maxH = pageHeight - margin * 2;
      let w = img.width, h = img.height;
      const scale = Math.min(maxW / w, maxH / h);
      w *= scale; h *= scale;
      const x = (pageWidth - w) / 2, y = (pageHeight - h) / 2;
      const fmt = dataUrl.indexOf('image/png') !== -1 ? 'PNG' : 'JPEG';
      doc.addImage(dataUrl, fmt, x, y, w, h);
    }
    doc.save('smarthelper-images.pdf');
    showToast('toastPdfGenerated');
  } catch (e) {
    showToast('toastPdfNoImages');
  }
});

/* ============================================================
   HIJRI DATE CONVERTER
   ============================================================ */
function gregorianToJD(y, m, d) {
  return Math.floor((1461 * (y + 4800 + Math.floor((m - 14) / 12))) / 4) +
    Math.floor((367 * (m - 2 - 12 * Math.floor((m - 14) / 12))) / 12) -
    Math.floor((3 * Math.floor((y + 4900 + Math.floor((m - 14) / 12)) / 100)) / 4) +
    d - 32075;
}
function jdToHijri(jdIn) {
  let jd = jdIn - 1948440 + 10632;
  const n = Math.floor((jd - 1) / 10631);
  jd = jd - 10631 * n + 354;
  const j = Math.floor((10985 - jd) / 5316) * Math.floor((50 * jd) / 17719) + Math.floor(jd / 5670) * Math.floor((43 * jd) / 15238);
  jd = jd - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
  const month = Math.floor((24 * jd) / 709);
  const day = jd - Math.floor((709 * month) / 24);
  const year = 30 * n + j - 30;
  return { year, month, day };
}
document.getElementById('hijriConvertBtn').addEventListener('click', () => {
  const val = document.getElementById('hijriInput').value;
  if (!val) return;
  const [y, m, d] = val.split('-').map(Number);
  const jd = gregorianToJD(y, m, d);
  const h = jdToHijri(jd);
  const monthName = translations[currentLang].hijriMonths[h.month - 1] || h.month;
  document.getElementById('hijriResultVal').textContent = `${h.day} ${monthName} ${h.year} AH`;
  document.getElementById('hijriResult').classList.remove('hidden');
});

  }
  resBox.classList.remove('hidden');
});

/* ============================================================
   NOTES / TO-DO (localStorage)
   ============================================================ */
function getNotes() { try { return JSON.parse(localStorage.getItem('sh_notes') || '[]'); } catch(e) { return []; } }
function saveNotes(list) { try { localStorage.setItem('sh_notes', JSON.stringify(list)); } catch(e) {} }
function renderNotes() {
  const list = getNotes();
  const box = document.getElementById('notesList');
  const empty = document.getElementById('notesEmpty');
  if (!box) return;
  box.innerHTML = '';
  empty.classList.toggle('hidden', list.length > 0);
  list.forEach(note => {
    const row = document.createElement('div');
    row.className = 'note-item glass-chip';
    row.innerHTML = `<span class="text-sm flex-1">${escapeHtml(note.text)}</span>
      <svg class="icon icon-sm note-del" data-id="${note.id}" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`;
    box.appendChild(row);
  });
  box.querySelectorAll('.note-del').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-id');
      saveNotes(getNotes().filter(n => String(n.id) !== id));
      renderNotes();
    });
  });
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
document.getElementById('noteAddBtn').addEventListener('click', addNote);
document.getElementById('noteInput').addEventListener('keydown', e => { if (e.key === 'Enter') addNote(); });
function addNote() {
  const input = document.getElementById('noteInput');
  const text = input.value.trim();
  if (!text) { showToast('toastNoteEmpty'); return; }
  const list = getNotes();
  list.unshift({ id: Date.now(), text });
  saveNotes(list);
  input.value = '';
  renderNotes();
}

/* ============================================================
   INIT
   ============================================================ */
populateUnitSelects(currentUnitTab);
applyLang(currentLang);
renderRecent();
renderNotes();
showPage(location.hash.replace('#', '') || 'home');
</script>
